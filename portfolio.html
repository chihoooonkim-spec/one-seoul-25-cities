<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #edeae4;
  --sidebar: #141210;
  --sidebar-text: #c8c4bc;
  --text: #181614;
  --muted: #8a8680;
  --border: #d4d0c9;
  --card-bg: #e8e4dd;
}

body {
  font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  min-height: 100vh;
}

/* ─── SIDEBAR ─────────────────────────── */
.sidebar {
  width: 220px;
  min-width: 220px;
  background: var(--sidebar);
  height: 100vh;
  position: fixed;
  top: 0; left: 0;
  display: flex;
  flex-direction: column;
  padding: 36px 28px 28px;
  z-index: 200;
  overflow: hidden;
}

.s-wordmark {
  margin-bottom: 36px;
}

.s-name {
  font-size: 14px;
  font-weight: 700;
  color: #f0ece5;
  letter-spacing: -0.3px;
  line-height: 1.2;
  margin-bottom: 5px;
}

.s-role {
  font-size: 9px;
  font-weight: 300;
  color: rgba(255,255,255,0.3);
  letter-spacing: 2px;
  text-transform: uppercase;
}

.s-divider {
  width: 100%;
  height: 1px;
  background: rgba(255,255,255,0.07);
  margin-bottom: 20px;
}

.s-nav {
  list-style: none;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.s-nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  cursor: pointer;
  transition: all 0.15s;
  user-select: none;
}

.s-nav-num {
  font-size: 8.5px;
  color: rgba(255,255,255,0.18);
  font-weight: 300;
  letter-spacing: 0.5px;
  width: 14px;
  flex-shrink: 0;
}

.s-nav-label {
  font-size: 11.5px;
  font-weight: 300;
  color: var(--sidebar-text);
  letter-spacing: 0.2px;
  transition: color 0.15s;
}

.s-nav-item:hover .s-nav-label { color: #f0ece5; }
.s-nav-item:hover .s-nav-num   { color: rgba(255,255,255,0.4); }

.s-nav-item.active .s-nav-label { color: #f0ece5; font-weight: 600; }
.s-nav-item.active .s-nav-num   { color: rgba(255,255,255,0.45); }

.s-footer {
  border-top: 1px solid rgba(255,255,255,0.07);
  padding-top: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.lang-toggle {
  display: flex;
  align-items: center;
  border: 1px solid rgba(255,255,255,0.13);
  border-radius: 2px;
  overflow: hidden;
  width: fit-content;
}

.lang-btn {
  padding: 5px 11px;
  font-size: 9px;
  font-family: inherit;
  font-weight: 400;
  letter-spacing: 1px;
  background: transparent;
  color: rgba(255,255,255,0.28);
  border: none;
  cursor: pointer;
  transition: all 0.15s;
}

.lang-btn + .lang-btn { border-left: 1px solid rgba(255,255,255,0.13); }

.lang-btn.active {
  background: rgba(255,255,255,0.1);
  color: #f0ece5;
}

.s-copy {
  font-size: 8.5px;
  color: rgba(255,255,255,0.15);
  font-weight: 300;
  letter-spacing: 0.3px;
}

/* ─── MAIN ─────────────────────────────── */
.main {
  margin-left: 220px;
  flex: 1;
  min-height: 100vh;
  position: relative;
}

.section {
  display: none;
  padding: 52px 56px 96px;
  min-height: 100vh;
  animation: fadein 0.25s ease;
}

.section.active { display: block; }

@keyframes fadein {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

.sec-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 44px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border);
}

.sec-title {
  font-size: 9.5px;
  font-weight: 400;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--muted);
}

.sec-meta {
  font-size: 9.5px;
  color: var(--muted);
  font-weight: 300;
  letter-spacing: 0.3px;
}

/* ─── PROJECT GRID (CARD) ───────────────── */
.project-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
}

.project-card {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border: 1px solid var(--border);
  transition: transform 0.25s cubic-bezier(0.2,0,0.2,1),
              box-shadow 0.25s;
  cursor: default;
}

.project-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 16px 40px rgba(0,0,0,0.1);
}

/* Image area */
.p-img {
  height: 280px;
  background: #181412;
  overflow: hidden;
  position: relative;
  flex-shrink: 0;
}

.p-img img {
  width: 100%; height: 100%;
  object-fit: cover;
  transition: transform 0.5s ease;
}

.project-card:hover .p-img img { transform: scale(1.03); }

.p-img-empty {
  width: 100%; height: 100%;
  display: flex;
  align-items: flex-end;
  padding: 20px 24px;
  background: linear-gradient(160deg, #1e1c18 60%, #2a2620);
}

.p-img-empty-num {
  font-size: 72px;
  font-weight: 700;
  color: rgba(255,255,255,0.05);
  letter-spacing: -4px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  user-select: none;
}

/* Text panel */
.p-panel {
  background: var(--pp, #e8e4dd);
  padding: 18px 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  flex: 1;
}

.p-panel-main {
  display: grid;
  grid-template-columns: 2fr 3fr;
  gap: 0 20px;
  align-items: start;
}

/* Left: brand mark + category */
.p-panel-left {}

.p-brand {
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.2px;
  margin-bottom: 6px;
}

.p-brand sup {
  font-size: 8px;
  font-weight: 400;
  vertical-align: super;
  letter-spacing: 0;
}

.p-numcat {
  font-size: 9px;
  color: var(--muted);
  font-weight: 300;
  letter-spacing: 0.5px;
  display: flex;
  align-items: center;
  gap: 7px;
}

.p-numcat-num {
  font-weight: 600;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}

/* Right: title + desc */
.p-panel-right {}

.p-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.3px;
  line-height: 1.25;
  margin-bottom: 7px;
}

.p-desc {
  font-size: 10.5px;
  font-weight: 300;
  color: #5a5652;
  line-height: 1.85;
}

/* Bottom row */
.p-panel-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 10px;
  border-top: 1px solid rgba(0,0,0,0.08);
}

.p-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.p-tag {
  font-size: 7.5px;
  letter-spacing: 0.9px;
  padding: 2px 7px;
  border: 1px solid rgba(0,0,0,0.14);
  color: var(--muted);
  border-radius: 1px;
  font-weight: 400;
  text-transform: uppercase;
}

.p-year-link {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.p-year {
  font-size: 9.5px;
  font-weight: 300;
  color: var(--muted);
}

.p-link {
  font-size: 9px;
  letter-spacing: 0.8px;
  color: var(--text);
  text-decoration: none;
  font-weight: 500;
  border-bottom: 1px solid rgba(24,22,20,0.35);
  padding-bottom: 1px;
  transition: opacity 0.15s;
  white-space: nowrap;
}

.p-link:hover { opacity: 0.4; }

/* Bottom accent line */
.p-accent {
  height: 3px;
  background: var(--ac, var(--muted));
  flex-shrink: 0;
}

/* ─── ABOUT ─────────────────────────────── */
.about-layout {
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  gap: 72px;
  max-width: 820px;
}

.about-block {}

.ab-label {
  font-size: 8.5px;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 18px;
  font-weight: 400;
}

.ab-text {
  font-size: 12.5px;
  font-weight: 300;
  color: #444;
  line-height: 2;
}

.skill-list {
  display: flex;
  flex-direction: column;
}

.skill-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}

.skill-row:first-child { border-top: 1px solid var(--border); }

.sk-name {
  font-size: 11.5px;
  font-weight: 400;
  color: var(--text);
}

.sk-level {
  font-size: 8.5px;
  color: var(--muted);
  font-weight: 300;
  letter-spacing: 0.8px;
}

/* ─── JOURNEY / FLOORS ─────────────────── */
.journey-intro {
  font-size: 11.5px;
  font-weight: 300;
  color: var(--muted);
  line-height: 1.9;
  max-width: 480px;
  margin-bottom: 52px;
  letter-spacing: 0.2px;
}

.floors-outer {
  position: relative;
}

.floors-stack {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.floor-card {
  display: grid;
  grid-template-columns: 52px 1fr;
  gap: 0 20px;
  transform: translateX(var(--fx, 0px));
  transition: transform 0.28s cubic-bezier(0.2,0,0.2,1);
  cursor: default;
}

.floor-card:hover {
  transform: translateX(var(--fx, 0px)) translateY(-5px);
}

.floor-num {
  font-size: 30px;
  font-weight: 700;
  color: rgba(24,22,20,0.09);
  text-align: right;
  line-height: 1;
  padding-top: 14px;
  letter-spacing: -1.5px;
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}

.floor-body {
  border-left: 3px solid var(--fc, #aaa);
  background: #eae6df;
  padding: 20px 26px 22px;
  position: relative;
  transition: box-shadow 0.28s, background 0.2s;
}

/* Slab-edge shadow — the architectural "floor thickness" */
.floor-body::after {
  content: '';
  position: absolute;
  bottom: -5px; left: -3px; right: 0;
  height: 5px;
  background: var(--fc, #aaa);
  opacity: 0.18;
  pointer-events: none;
}

.floor-card:hover .floor-body {
  background: #e6e2da;
  box-shadow: 0 12px 32px rgba(0,0,0,0.09);
}

.floor-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 12px;
}

.floor-period {
  font-size: 8.5px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 400;
}

.floor-phase {
  font-size: 20px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.6px;
  line-height: 1.1;
  margin-bottom: 11px;
}

.floor-desc {
  font-size: 11.5px;
  font-weight: 300;
  color: #5a5652;
  line-height: 1.9;
  margin-bottom: 15px;
  max-width: 540px;
}

.floor-tools {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.floor-tool {
  font-size: 7.5px;
  letter-spacing: 1px;
  padding: 3px 8px;
  border: 1px solid var(--fc, #aaa);
  color: var(--fc, #aaa);
  border-radius: 1px;
  font-weight: 400;
  text-transform: uppercase;
  opacity: 0.75;
}

/* ─── CONTACT ───────────────────────────── */
.contact-list {
  display: flex;
  flex-direction: column;
  max-width: 480px;
}

.contact-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 0;
  border-bottom: 1px solid var(--border);
}

.contact-item:first-child { border-top: 1px solid var(--border); }

.ct-label {
  font-size: 8.5px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 400;
}

.ct-value {
  font-size: 12px;
  font-weight: 300;
  color: var(--text);
  text-decoration: none;
  transition: opacity 0.15s;
}

.ct-value:hover { opacity: 0.45; }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="s-wordmark">
    <div class="s-name" id="s-name">Your Name</div>
    <div class="s-role" id="s-role">Designer</div>
  </div>

  <div class="s-divider"></div>

  <ul class="s-nav">
    <li class="s-nav-item active" onclick="showSection('work')">
      <span class="s-nav-num">01</span>
      <span class="s-nav-label" data-en="Work" data-ko="작업">Work</span>
    </li>
    <li class="s-nav-item" onclick="showSection('about')">
      <span class="s-nav-num">02</span>
      <span class="s-nav-label" data-en="About" data-ko="소개">About</span>
    </li>
    <li class="s-nav-item" onclick="showSection('contact')">
      <span class="s-nav-num">03</span>
      <span class="s-nav-label" data-en="Contact" data-ko="연락">Contact</span>
    </li>
    <li class="s-nav-item" onclick="showSection('journey')">
      <span class="s-nav-num">04</span>
      <span class="s-nav-label" data-en="Journey" data-ko="여정">Journey</span>
    </li>
  </ul>

  <div class="s-footer">
    <div class="lang-toggle">
      <button class="lang-btn active" onclick="setLang('en')">EN</button>
      <button class="lang-btn" onclick="setLang('ko')">KO</button>
    </div>
    <div class="s-copy" id="s-copy">© 2025</div>
  </div>
</aside>

<main class="main">
  <!-- WORK -->
  <section class="section active" id="sec-work">
    <div class="sec-header">
      <span class="sec-title" data-en="Selected Work" data-ko="작업 목록">Selected Work</span>
      <span class="sec-meta" id="work-count"></span>
    </div>
    <div class="project-grid" id="project-list"></div>
  </section>

  <!-- ABOUT -->
  <section class="section" id="sec-about">
    <div class="sec-header">
      <span class="sec-title" data-en="About" data-ko="소개">About</span>
    </div>
    <div class="about-layout">
      <div class="about-block">
        <div class="ab-label" data-en="Profile" data-ko="프로필">Profile</div>
        <div class="ab-text" id="about-bio"></div>
      </div>
      <div class="about-block">
        <div class="ab-label" data-en="Skills" data-ko="스킬">Skills</div>
        <div class="skill-list" id="about-skills"></div>
      </div>
    </div>
  </section>

  <!-- JOURNEY -->
  <section class="section" id="sec-journey">
    <div class="sec-header">
      <span class="sec-title" data-en="Journey" data-ko="여정">Journey</span>
      <span class="sec-meta" data-en="Design evolution by floor" data-ko="층별 디자인 발전 과정">Design evolution by floor</span>
    </div>
    <div class="journey-intro" id="journey-intro"></div>
    <div class="floors-outer">
      <div class="floors-stack" id="floors-stack"></div>
    </div>
  </section>

  <!-- CONTACT -->
  <section class="section" id="sec-contact">
    <div class="sec-header">
      <span class="sec-title" data-en="Contact" data-ko="연락">Contact</span>
    </div>
    <div class="contact-list" id="contact-list"></div>
  </section>
</main>

<script>
// ════════════════════════════════════════════════════════
//  PORTFOLIO DATA — 여기만 수정하면 됩니다
// ════════════════════════════════════════════════════════

const ME = {
  en: { name: "Your Name",  role: "Designer" },
  ko: { name: "이름",       role: "디자이너" },
};

const PROJECTS = [
  {
    num: '01',
    year: '2025',
    title:    { en: 'How to Live in Seoul',   ko: '서울에서 어떻게 사는가' },

    desc: {

  },
  // ── 프로젝트 추가 예시 ──────────────────────────────────
  // {

  //   year: '2024',
  //   title:    { en: 'Project Title',  ko: '프로젝트 이름' },

];

const ABOUT = {
  bio: {
    en: "Designer based in Seoul. Focused on visual identity, data visualization, and interactive experiences that make complex information legible and compelling.",
    ko: "서울을 기반으로 활동하는 디자이너. 복잡한 정보를 명료하고 매력적으로 전달하는 브랜드 아이덴티티, 데이터 시각화, 인터랙티브 경험에 집중합니다.",

    { name: { en: 'Motion',             ko: '모션'              }, level: { en: 'Exploring', ko: '탐색 중' } },

// 층별 성장 여정 — 위(04)가 최신, 아래(01)가 시작점

const LAYERS = [
  {
    floor: '04',
    period:  { en: '2024 — Present',  ko: '2024 — 현재' },
    phase:   { en: 'Systems & Data',  ko: '시스템과 데이터' },
    desc: {
      en: 'Designing complex information systems and interactive data experiences. Thinking in flows, hierarchies, and user journeys — not just static artifacts.',

  {

    period:  { en: '2022 — 2023',        ko: '2022 — 2023' },
    phase:   { en: 'Finding a Voice',    ko: '목소리 찾기' },
    desc: {
      en: 'Visual identity, editorial design, and spatial concepts. Started developing a consistent aesthetic language — minimal, structured, and precise.',
      ko: '비주얼 아이덴티티, 에디토리얼, 공간 개념을 탐구했습니다. 미니멀하고 구조적이며 정밀한, 나만의 미적 언어를 발전시키기 시작했습니다.',
    },
    tools: ['Brand', 'Editorial', 'Print', 'Figma'],
    color: '#6a9470',
  },
  {
    floor: '02',
    period:  { en: '2020 — 2021',          ko: '2020 — 2021' },
    phase:   { en: 'Learning the Craft',   ko: '기술 습득' },
    desc: {
      en: 'Foundations of typography, grid systems, and visual communication. Learning to see — really see — how design shapes meaning.',
      ko: '타이포그래피, 그리드 시스템, 시각 커뮤니케이션의 기초를 다졌습니다. 디자인이 어떻게 의미를 만드는지 진정으로 보는 법을 배웠습니다.',
    },
    tools: ['Typography', 'Grid', 'Illustration', 'Print'],
    color: '#90b490',
  },
  {
    floor: '01',
    period:  { en: '— 2019',      ko: '— 2019' },
    phase:   { en: 'Beginnings',  ko: '시작' },
    desc: {
      en: 'First encounters with design. Curiosity, experimentation, and a lot of mistakes that taught more than any success could.',
      ko: '디자인과의 첫 만남. 호기심, 실험, 그리고 어떤 성공보다 더 많은 것을 가르쳐 준 수많은 실수들.',
    },
    tools: ['Basics', 'Exploration', 'Sketch'],
    color: '#b8ceb8',
  },
];

const JOURNEY_INTRO = {
  en: 'Each floor represents a phase of my design practice. The foundation is where it began — the roof is where I am now.',
  ko: '각 층은 나의 디자인 여정의 한 단계를 나타냅니다. 기초는 시작이었고, 지붕은 지금의 나입니다.',
};

const CONTACT = [
  { label: { en: 'Email',     ko: '이메일'     }, value: 'hello@yourname.com',               href: 'mailto:hello@yourname.com' },
  { label: { en: 'Instagram', ko: '인스타그램' }, value: '@yourhandle',                       href: 'https://instagram.com/yourhandle' },
  { label: { en: 'LinkedIn',  ko: '링크드인'   }, value: 'linkedin.com/in/yourname',          href: 'https://linkedin.com/in/yourname' },
];

// ════════════════════════════════════════════════════════
//  ENGINE — 수정 불필요
// ════════════════════════════════════════════════════════

let lang = 'en';

function setLang(l) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('active', b.textContent.toLowerCase() === l);
  });
  renderAll();
}

function showSection(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById('sec-' + id).classList.add('active');
  document.querySelectorAll('.s-nav-item').forEach((el, i) => {
    el.classList.toggle('active', ['work','about','contact','journey'][i] === id);
  });
}

function renderAll() {
  document.getElementById('s-name').textContent = ME[lang].name;
  document.getElementById('s-role').textContent = ME[lang].role;
  document.getElementById('s-copy').textContent = `© ${new Date().getFullYear()}`;

  // 정적 data-en/ko 요소
  document.querySelectorAll('[data-en]').forEach(el => {
    el.textContent = el.dataset[lang] || el.dataset.en;
  });

  // 프로젝트 목록
  const count = document.getElementById('work-count');
  count.textContent = `— ${PROJECTS.length} ${lang === 'en' ? (PROJECTS.length === 1 ? 'Project' : 'Projects') : '개'}`;

  document.getElementById('project-list').innerHTML = PROJECTS.map(p => {
    const panelStyle = p.panelBg ? `--pp:${p.panelBg}` : '';
    const accentStyle = p.accentColor ? `--ac:${p.accentColor}` : '';
    return `
    <div class="project-card">
      <div class="p-img">
        ${p.img
          ? `<img src="${p.img}" alt="${p.title[lang]}">`
          : `<div class="p-img-empty"><span class="p-img-empty-num">${p.num}</span></div>`}
      </div>
      <div class="p-panel" style="${panelStyle}">
        <div class="p-panel-main">
          <div class="p-panel-left">
            <div class="p-brand">${ME[lang].name}<sup>°</sup></div>
            <div class="p-numcat">
              <span class="p-numcat-num">${p.num}</span>
              ${p.category[lang]}
            </div>
          </div>
          <div class="p-panel-right">
            <div class="p-title">${p.title[lang]}</div>
            <div class="p-desc">${p.desc[lang]}</div>
          </div>
        </div>
        <div class="p-panel-bottom">
          <div class="p-tags">${p.tags.map(t => `<span class="p-tag">${t}</span>`).join('')}</div>
          <div class="p-year-link">
            <span class="p-year">${p.year}</span>
            ${p.link ? `<a class="p-link" href="${p.link}" target="_blank">${lang === 'en' ? 'View →' : '보기 →'}</a>` : ''}
          </div>
        </div>
      </div>
      <div class="p-accent" style="${accentStyle}"></div>
    </div>`;
  }).join('');

  // About
  document.getElementById('about-bio').textContent = ABOUT.bio[lang];
  document.getElementById('about-skills').innerHTML = ABOUT.skills.map(s => `
    <div class="skill-row">
      <span class="sk-name">${s.name[lang]}</span>
      <span class="sk-level">${s.level[lang]}</span>
    </div>
  `).join('');

  // Journey
  document.getElementById('journey-intro').textContent = JOURNEY_INTRO[lang];

  const FLOOR_OFFSET = 16; // px offset per floor step
  document.getElementById('floors-stack').innerHTML = LAYERS.map((l, i) => {
    const offset = i * FLOOR_OFFSET; // index 0 = newest = least offset
    return `
    <div class="floor-card" style="--fx:${offset}px; --fc:${l.color}">
      <div class="floor-num">${l.floor}</div>
      <div class="floor-body">
        <div class="floor-header">
          <span class="floor-period">${l.period[lang]}</span>
        </div>
        <div class="floor-phase">${l.phase[lang]}</div>
        <div class="floor-desc">${l.desc[lang]}</div>
        <div class="floor-tools">${l.tools.map(t => `<span class="floor-tool">${t}</span>`).join('')}</div>
      </div>
    </div>`;
  }).join('');

  // Contact
  document.getElementById('contact-list').innerHTML = CONTACT.map(c => `
    <div class="contact-item">
      <span class="ct-label">${c.label[lang]}</span>
      <a class="ct-value" href="${c.href}" target="_blank">${c.value}</a>
    </div>
  `).join('');
}

renderAll();
</script>
</body>
</html>
